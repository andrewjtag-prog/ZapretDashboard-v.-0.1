name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # Важно! Дает права на создание релиза

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ZapretDashboard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Zip output
      run: Compress-Archive -Path ./publish/* -DestinationPath ./ZapretDashboard.zip

    # Этот шаг создает релиз и прикрепляет к нему ZIP
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }} # Автоматически создает версию (v1.0.1, v1.0.2...)
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: ./ZapretDashboard.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
