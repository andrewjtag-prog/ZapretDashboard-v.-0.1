name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - run: dotnet publish ZapretDashboard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Zip output
      run: Compress-Archive -Path ./publish/* -DestinationPath ./ZapretDashboard.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZapretDashboard-ZIP
        path: ./ZapretDashboard.zip
