name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Поменял на 10, так как у тебя проект на .NET 10

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ZapretDashboard.csproj -c Release -r win-x64 --self-contained true -o ./publish
    - name: Zip output
      run: Compress-Archive -Path ./publish/* -DestinationPath ./ZapretDashboard.zip

    # СОЗДАНИЕ РЕЛИЗА
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: ./ZapretDashboard.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
